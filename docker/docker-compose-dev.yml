services:
  finanzdb:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: finanz
    volumes:
      - pgFinanz:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d finanz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "4000:4000"
    env_file:
      - ../.env
    environment:
      DB_HOST: finanzdb
      DB_PORT: 5432
    depends_on:
      finanzdb:
        condition: service_healthy
    volumes:
      - ../:/app
      - backendNodeModules:/app/node_modules

volumes:
  pgFinanz:
  backendNodeModules:
